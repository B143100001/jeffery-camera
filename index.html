<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>太空星際防衛戰 - 手勢互動遊戲</title>
  
  <!-- 鎖定 Teachable Machine 官方指定相容版本 (切勿改為 @latest) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>

  <style>
    :root {
      --bg-color: #0b0f19;
      --panel-bg: rgba(18, 26, 47, 0.9);
      --accent-color: #00f0ff;
      --shield-color: #00ffff;
      --attack-color: #ff3366;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif;
    }
    body {
      background-color: var(--bg-color);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    header {
      text-align: center;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.8rem;
      color: var(--accent-color);
      letter-spacing: 2px;
      margin-bottom: 5px;
    }
    .guide-text {
      color: #8fa0c2;
      font-size: 0.95rem;
    }

    /* file:/// 警示列 */
    #protocolWarning {
      display: none;
      background: #7a2b00;
      border: 1px solid #ff7b00;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      margin-bottom: 15px;
      width: 100%;
      max-width: 960px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* 控制面板 */
    .setup-card {
      background: var(--panel-bg);
      border: 1px solid #223558;
      border-radius: 10px;
      padding: 12px 20px;
      margin-bottom: 15px;
      display: flex;
      gap: 15px;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 960px;
    }
    .setup-info {
      font-size: 0.9rem;
      color: #b0c4de;
    }
    .setup-card button {
      background: var(--accent-color);
      color: #05101e;
      border: none;
      padding: 10px 22px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .setup-card button:hover {
      background: #5df6ff;
    }

    /* 主畫面容器 */
    .main-container {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      width: 100%;
      max-width: 960px;
    }

    /* 左側 AI 監視面板 */
    .ai-panel {
      background: var(--panel-bg);
      border: 1px solid #223558;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .webcam-box {
      width: 260px;
      height: 200px;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      border: 2px solid var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
    }
    .status-badge {
      font-size: 0.9rem;
      padding: 4px 12px;
      border-radius: 20px;
      background: #1e2942;
      margin-bottom: 12px;
      text-align: center;
      max-width: 260px;
      word-break: break-all;
    }
    .confidence-list {
      width: 100%;
    }
    .confidence-item {
      margin-bottom: 10px;
    }
    .confidence-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 3px;
    }
    .bar-bg {
      background: #141c30;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-color);
      transition: width 0.08s ease;
    }

    /* 右側遊戲畫布面板 */
    .game-panel {
      position: relative;
      background: var(--panel-bg);
      border: 1px solid #223558;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #gameCanvas {
      background: #050811;
      border-radius: 8px;
      border: 1px solid #1a2a46;
      width: 100%;
      max-width: 580px;
      height: 380px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 580px;
      margin-top: 10px;
      font-size: 1.1rem;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      .main-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>🚀 太空星際防衛戰 (SPACE GUARDIAN)</h1>
    <p class="guide-text">手勢控制：【✋ 出「布」】啟動能量護盾 | 【✊ 出「石頭」】電漿砲開火</p>
  </header>

  <!-- file:/// 環境警告提醒 -->
  <div id="protocolWarning">
    ⚠️ <b>瀏覽器安全性限制提醒：</b><br>
    您目前是以本機檔案 (<code>file:///</code>) 開啟網頁。Chrome 政策會<b>完全阻擋攝影機權限與讀取模型</b>！<br>
    👉 請務必上傳至 <b>GitHub Pages (HTTPS)</b> 開啟，或在 VS Code 使用 <b>Live Server</b>。
  </div>

  <section class="setup-card">
    <div class="setup-info">
      🔹 模型來源：<code>model.json</code> / <code>metadata.json</code> / <code>weights.bin</code>
    </div>
    <button id="startBtn">啟動攝影機並開始遊戲</button>
  </section>

  <div class="main-container">
    <!-- 左側 AI 監視器 -->
    <aside class="ai-panel">
      <h3>視覺辨識監視器</h3>
      <div id="status" class="status-badge">等待啟動...</div>
      <div class="webcam-box" id="webcam-container">
        <span style="color:#556b8d; font-size:0.85rem;">尚未開啟鏡頭</span>
      </div>
      <div class="confidence-list" id="label-container"></div>
    </aside>

    <!-- 右側 遊戲畫布 -->
    <main class="game-panel">
      <canvas id="gameCanvas" width="580" height="380"></canvas>
      <div class="hud">
        <div>得分 (Score): <span id="scoreVal" style="color:var(--accent-color)">0</span></div>
        <div>狀態: <span id="actionVal" style="color:#fff">巡航中</span></div>
      </div>
    </main>
  </div>

  <script>
    // 檢查是否為 file:/// 本地路徑開啟
    if (window.location.protocol === 'file:') {
      document.getElementById('protocolWarning').style.display = 'block';
    }

    // --- 1. 常數與手勢對應邏輯 ---
    const CONFIG = {
      CANVAS_WIDTH: 580,
      CANVAS_HEIGHT: 380,
      SHIP_X: 90,
      ATTACK_COOLDOWN_MS: 320,
      THRESHOLD: 0.70
    };

    const ActionType = {
      SHIELD: 'SHIELD', // 對應「布」
      ATTACK: 'ATTACK', // 對應「石頭」
      IDLE: 'IDLE'
    };

    function mapLabelToAction(label) {
      if (label === '布') return ActionType.SHIELD;
      if (label === '石頭') return ActionType.ATTACK;
      return ActionType.IDLE;
    }

    // --- 2. Web Audio API 音效模組 ---
    class SoundFX {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      playTone(freq, type, duration) {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }
    }
    const sfx = new SoundFX();

      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.score = 0;
        this.lastFrameTime = performance.now();
        this.lastAttackTime = 0;
        this.currentAction = ActionType.IDLE;
